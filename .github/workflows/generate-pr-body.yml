name: Generate PR body

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-body:
    runs-on: ubuntu-latest
    steps:
      - name: Generate PR description and update PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request || {};
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              // Capture original How-to-test section verbatim (if present)
              const originalBody = pr.body || "";
              const howToMatch = originalBody.match(/(^|\n)(## How to test[\s\S]*?)(?=\n## |\n---|$)/im);
              const preservedHowTo = howToMatch ? howToMatch[2].trim() : "";

              // Fetch commits
              const commitsResp = await github.rest.pulls.listCommits({
                owner, repo, pull_number: pr.number, per_page: 250
              });
              const commits = commitsResp.data || [];
              const commitLines = commits.map(c => `- ${c.commit.message.split('\n')[0]} (${c.sha.slice(0,7)})`).join('\n') || '- (no commits)';

              // Fetch changed files
              const filesResp = await github.rest.pulls.listFiles({
                owner, repo, pull_number: pr.number, per_page: 250
              });
              const files = filesResp.data || [];
              const fileLines = files.map(f => `- ${f.filename}`).join('\n') || '- (no files)';

              // PR stats
              const prFull = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              const additions = prFull.data.additions ?? 0;
              const deletions = prFull.data.deletions ?? 0;
              const changedFilesCount = files.length;

              // Build the generated body (header: summary, commits, changed files)
              let generatedBody = `<!-- AUTO-GENERATED: do not edit -->\n## Summary\n${pr.title || ''}\n\n## Commits (${commits.length})\n${commitLines}\n\n## Changed files (${changedFilesCount}, +${additions}/-${deletions})\n${fileLines}\n\n---\n*This PR body was generated automatically.*\n\n`;

              // If there is a preserved How-to-test block, append it verbatim at the bottom
              if (preservedHowTo) {
                // Ensure a blank line separation before appending preserved section
                generatedBody = generatedBody.trimEnd() + "\n\n" + preservedHowTo + "\n";
              }

              // Update PR body (overwrite everything except we preserved the How-to-test verbatim above)
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                body: generatedBody
              });

              console.log('PR body updated (preserved How-to-test:', Boolean(preservedHowTo), ').');
            } catch (error) {
              console.error('Failed to generate PR body:', error);
              throw error;
            }
